# =============================================================================
# 0 FOMO - Android CI
#   PR / push to main : unit tests + lint + debug APK (artifact, 14 days)
#   tag v*            : signed release AAB -> GitHub Release + Play internal track
#
# Secrets required for the release job (Settings -> Secrets -> Actions):
#   ZEROFOMO_UPLOAD_KEYSTORE_B64  base64 of the upload keystore (.jks)
#   ZEROFOMO_KEYSTORE_PASSWORD, ZEROFOMO_KEY_ALIAS, ZEROFOMO_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON     Play Console API service-account key
# =============================================================================
name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["zero_fomo/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["zero_fomo/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + lint + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero_fomo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Lint
        run: gradle :app:lintDebug --no-daemon
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            zero_fomo/app/build/reports/**
            zero_fomo/app/build/test-results/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: zero-fomo-debug-apk
          path: zero_fomo/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Signed release AAB -> Play internal
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the AAB to the GitHub Release
    environment: play-internal
    defaults:
      run:
        working-directory: zero_fomo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Materialize upload keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
        env:
          KEYSTORE_B64: ${{ secrets.ZEROFOMO_UPLOAD_KEYSTORE_B64 }}
      - name: Build signed AAB
        run: gradle :app:bundleRelease --no-daemon
        env:
          ZEROFOMO_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ZEROFOMO_KEYSTORE_PASSWORD: ${{ secrets.ZEROFOMO_KEYSTORE_PASSWORD }}
          ZEROFOMO_KEY_ALIAS: ${{ secrets.ZEROFOMO_KEY_ALIAS }}
          ZEROFOMO_KEY_PASSWORD: ${{ secrets.ZEROFOMO_KEY_PASSWORD }}
          ZEROFOMO_INBOX_TOKEN: ${{ secrets.ZEROFOMO_INBOX_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: zero-fomo-release-aab
          path: zero_fomo/app/build/outputs/bundle/release/*.aab
      - name: Check Play credentials
        id: play
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set; skipping Play upload (download the AAB from the GitHub Release instead)"; fi
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Upload to Play internal track
        if: steps.play.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arctechnology.zerofomo
          releaseFiles: zero_fomo/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - uses: softprops/action-gh-release@v2
        with:
          files: zero_fomo/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
