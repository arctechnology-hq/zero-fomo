# =============================================================================
# 0 FOMO — cloud auto-scrape (activates the moment this folder is pushed
# to a GitHub repo with Pages enabled).
#
# Every 6 hours: run the aggregation pipeline, publish events.json to GitHub
# Pages. The app then syncs fresh data on every launch with zero PC involved.
# Feed URL becomes:  https://<user>.github.io/<repo>/events.json
# — set that (with trailing slash on the directory) as FEED_BASE_URL.
# =============================================================================
name: Scrape and publish events feed

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch: {}        # manual "Run workflow" button
  push:
    branches: [main]           # pipeline changes take effect immediately

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pandas python-dateutil openpyxl rapidfuzz playwright
          # Bandsintown sits behind Cloudflare — without a real browser the
          # source silently yields zero events.
          playwright install --with-deps chromium

      - name: Run aggregation pipeline (launch market, strict floor)
        run: python comprehensive_bahamas_scraper.py --delay 2.0

      # Every other market is best-effort: a broken city never blocks the
      # Nassau feed. Keys are optional; keyed sources skip cleanly without them.
      - name: Run per-market pipelines
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
        run: |
          mkdir -p feeds/bs-nassau
          python - <<'PY'
          import json
          f = json.load(open("New_Providence_Events.json", encoding="utf-8"))
          json.dump(f, open("feeds/bs-nassau/events.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          PY
          for m in $(python comprehensive_bahamas_scraper.py --list-markets); do
            [ "$m" = "bs-nassau" ] && continue
            echo "::group::market $m"
            python comprehensive_bahamas_scraper.py --market "$m" --delay 2.0 --no-details               || echo "::warning::market $m did not pass (see log)"
            echo "::endgroup::"
          done
          python build_markets_manifest.py

      - name: Stage feed for Pages
        run: |
          mkdir -p _site/.well-known
          cp New_Providence_Events.json _site/events.json
          cp -r feeds _site/feeds
          cp site/privacy.html _site/privacy.html
          cp site/index.html _site/index.html
          cp site/assetlinks.json _site/.well-known/assetlinks.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
