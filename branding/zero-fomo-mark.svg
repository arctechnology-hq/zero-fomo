<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="0 FOMO mark">
  <title>0 FOMO mark: The Cancelled Zero</title>
  <!-- Two arms (volt, aqua) form the zero and overlap at the bottom; a diagonal bar
       from top-left to bottom-right strikes it through, the way a prohibition sign
       does. FOMO, cancelled. The bar also makes the glyph read as a slashed zero. -->
  <rect width="160" height="160" rx="36" fill="#0B0F14"/>
  <path d="M62.90,33.02 A50,50 0 1 0 112.14,118.30" fill="none" stroke="#C8FF2E" stroke-width="16" stroke-linecap="round"/>
  <path d="M97.10,33.02 A50,50 0 1 1 47.86,118.30" fill="none" stroke="#19D3C5" stroke-width="16" stroke-linecap="round"/>
  <path d="M58.8,58.8 L101.2,101.2" fill="none" stroke="#F5F4EF" stroke-width="16" stroke-linecap="round"/>
</svg>
