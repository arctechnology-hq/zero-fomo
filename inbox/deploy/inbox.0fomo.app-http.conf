# Port-80 vhost for inbox.0fomo.app: serves Let's Encrypt HTTP-01 challenges
# from /var/www/acme and redirects everything else to HTTPS. Safe to enable
# before any certificate exists (no TLS references), which is what lets
# certbot --webroot issue the first cert.
<VirtualHost *:80>
    ServerName inbox.0fomo.app
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://inbox.0fomo.app/$1
    ErrorLog ${APACHE_LOG_DIR}/inbox_error.log
    CustomLog ${APACHE_LOG_DIR}/inbox_access.log combined
</VirtualHost>
