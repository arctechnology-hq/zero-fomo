# Apache vhost for the 0 FOMO inbox on fie-worker-1 (next to psa.conf).
# TLS: certbot --apache -d inbox.0fomo.app (after the DNS record exists).
<VirtualHost *:80>
    ServerName inbox.0fomo.app
    Redirect permanent / https://inbox.0fomo.app/
</VirtualHost>
<VirtualHost *:443>
    ServerName inbox.0fomo.app
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/inbox.0fomo.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inbox.0fomo.app/privkey.pem
    Protocols h2 http/1.1

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
    LimitRequestBody 6500000

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    ErrorLog ${APACHE_LOG_DIR}/inbox_error.log
    CustomLog ${APACHE_LOG_DIR}/inbox_access.log combined
</VirtualHost>
